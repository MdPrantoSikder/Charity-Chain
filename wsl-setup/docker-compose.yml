services:
  node1:
    image: mdpranto0sikder/cbbft-besu:1.0
    container_name: cbbft-node1
    environment:
      BESU_OPTS: "-Xmx512m"
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --data-path=/opt/besu/data
      - --node-private-key-file=/opt/besu/data/key
      - --p2p-host=172.28.0.10
      - --p2p-port=30303
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --rpc-ws-api=ETH,NET,WEB3
      - --rpc-http-api=ETH,NET,WEB3,ADMIN,TXPOOL,QBFT,IBFT
      - --host-allowlist=*
      - --rpc-http-cors-origins=*
      - --min-gas-price=0
    volumes:
      - ./networkFiles/genesis.json:/opt/besu/genesis.json:ro
      - ./node1/data:/opt/besu/data
    ports:
      - "8545:8545"
      - "8600:8546"
    cpus: 2.0
    mem_limit: 900m
    labels:
      cbbft.tier: "A"
    networks:
      cbbft:
        ipv4_address: 172.28.0.10
